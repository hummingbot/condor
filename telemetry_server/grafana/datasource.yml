# Grafana reads the collector's Postgres directly. There is no API in between:
# the queries in ../queries/ are plain SQL against the rollup tables, so a panel
# is a paste rather than an integration.
#
# The account is read-only by intent. Grant it explicitly after first boot:
#   CREATE USER grafana WITH PASSWORD '...';
#   GRANT CONNECT ON DATABASE telemetry TO grafana;
#   GRANT USAGE ON SCHEMA public TO grafana;
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana;

apiVersion: 1

datasources:
  - name: Telemetry
    type: postgres
    uid: condor-telemetry
    access: proxy
    url: postgres:5432
    database: telemetry
    user: telemetry
    secureJsonData:
      password: ${TELEMETRY_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
    editable: false
