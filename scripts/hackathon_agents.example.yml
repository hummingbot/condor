# Agent map for scripts/hackathon_monitor.py (HACKATHON_AGENT_MAP).
#
# Race agent id (the strategy slug the leaderboard uses) -> the Condor run keys
# (`agent.strategy`) whose bots and executors make up that agent. Copy this
# file, check every key against the strategies installed on this host:
#
#   uv run python -c "from condor.agents.strategy import StrategyStore; [print(s.key) for s in StrategyStore().list_all()]"
#
# and fill in the empty ones. An id mapped to [] is measured as nothing and
# logged every minute until it is filled.
#
# The 14 agents of agent-builders-cup-1 as of 2026-10-03. Keys were read from
# each submission's AGENT.md / loops/<slug>/loop.md and assume the agent was
# installed under its own folder name.

