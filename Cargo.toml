# The Anchor workspace for `programs/condor_vaults`. It sits at the repo root
# because that is where Anchor's CLI looks: `anchor idl build` walks up for
# Anchor.toml and then requires the crate to be under `<root>/programs/`, so a
# nested workspace would have to be `programs/programs/condor_vaults`.
# Nothing Python reads this file.
[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
