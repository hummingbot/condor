# conservative: wide two-level ladder on a liquid SPOT pair. Slow refresh with a
# tolerance band so orders are not cancelled on every small tick, long pause after a
# fill, and inventory skew on to lean back toward 50/50. For ranging or unclear markets
# and first deployments. order_amount is in BASE units (SOL), not quote.
# Capital needed: both SOL and USDT in the account (about 2 x order_amount per side).
controller_name: pmm_v1
controller_type: generic
connector_name: binance
trading_pair: SOL-USDT
order_amount: 0.1
buy_spreads:
- 0.004
- 0.008
sell_spreads:
- 0.004
- 0.008
order_refresh_time: 60
order_refresh_tolerance_pct: 0.002
filled_order_delay: 120
inventory_skew_enabled: true
target_base_pct: 0.5
inventory_range_multiplier: 1.0
price_ceiling: -1
price_floor: -1
