# Style: conservative
# BTC-USDT perp on 15m candles, standard 2-sigma bands, one position per side,
# low leverage and a long cooldown. Few, high-conviction mean-reversion entries
# with a 2% stop, a 3% limit take-profit and a trailing stop to lock in gains.
controller_name: macd_bb_v1
controller_type: directional_trading
connector_name: binance_perpetual
trading_pair: BTC-USDT
candles_connector: binance_perpetual
candles_trading_pair: BTC-USDT
interval: 15m
bb_length: 100
bb_std: 2.0
bb_long_threshold: 0.0
bb_short_threshold: 1.0
macd_fast: 21
macd_slow: 42
macd_signal: 9
total_amount_quote: 300
max_executors_per_side: 1
cooldown_time: 3600
leverage: 3
position_mode: HEDGE
stop_loss: 0.02
take_profit: 0.03
time_limit: 43200
take_profit_order_type: LIMIT
trailing_stop:
  activation_price: 0.015
  trailing_delta: 0.005
