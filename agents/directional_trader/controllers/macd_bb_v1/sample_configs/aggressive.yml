# Style: aggressive
# ETH-USDT perp on 3m candles with faster indicators (BB 50 / 1.8, MACD 12/26/9)
# and thresholds pulled inside the bands (0.1 / 0.9), so it fires much more often.
# Three stacked entries per side, 10x leverage, tight barriers, 45 min time limit.
# Scalping profile: fees and slippage matter a lot; backtest with realistic trade_cost.
controller_name: macd_bb_v1
controller_type: directional_trading
connector_name: binance_perpetual
trading_pair: ETH-USDT
candles_connector: binance_perpetual
candles_trading_pair: ETH-USDT
interval: 3m
bb_length: 50
bb_std: 1.8
bb_long_threshold: 0.1
bb_short_threshold: 0.9
macd_fast: 12
macd_slow: 26
macd_signal: 9
total_amount_quote: 300
max_executors_per_side: 3
cooldown_time: 300
leverage: 10
position_mode: HEDGE
stop_loss: 0.015
take_profit: 0.012
time_limit: 2700
take_profit_order_type: LIMIT
trailing_stop: null
