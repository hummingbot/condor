# Aggressive: ETH-USDT perp on 3m candles, fast and tight Supertrend (length 10, x2.0),
# higher leverage, up to three entries per side, short cooldown.
# Many signals and many flips: pays a lot of taker fees, backtest before any live use.
controller_name: supertrend_v1
controller_type: directional_trading
connector_name: binance_perpetual
trading_pair: ETH-USDT
candles_connector: binance_perpetual
candles_trading_pair: ETH-USDT
interval: 3m
length: 10
