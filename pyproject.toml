[project]
name = "condor"
version = "0.1.0"
description = "Local-first platform for autonomous trading agents"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv",
    "PyYAML",
    "aiohttp",
    "watchfiles",
    "kaleido",
    "plotly",
    "pandas",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "scipy>=1.17.1",
    "beautifulsoup4>=4.14.3",
    "solders>=0.27.1",
    "solana>=0.40.0",
    "hyperliquid-python-sdk>=0.24.0",
    "base58>=2.1.1",
    "py-clob-client-v2>=1.0.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "isort", "pre-commit"]

[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]
