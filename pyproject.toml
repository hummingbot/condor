[project]
name = "condor"
version = "0.1.0"
description = "Telegram bot for Hummingbot trading via Backend API"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]",
    # Condor's own scheduler (condor/scheduler.py). It already arrived with
    # python-telegram-bot[job-queue] — PTB's JobQueue is a thin wrapper over it —
    # so this is not a new dependency, only an honest one: we use APScheduler
    # directly now instead of reaching it through a Telegram object. Capped
    # below 4.0, which is a different API.
    "apscheduler>=3.11,<4",
    "hummingbot-api-client==1.5.7",
    "python-dotenv",
    "PyYAML",
    "aiohttp",
    "watchfiles",
    "kaleido",
    "plotly",
    "pandas",
    "geckoterminal-py",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "python-jose[cryptography]",
    "faster-whisper",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "pydantic-ai[mcp]",
    "beautifulsoup4>=4.14.3",
    "markdown>=3.10.2",
    "bleach>=6.4.0",
]

[dependency-groups]
# PEP 735 group: this is what ``uv sync --dev`` installs. Declared as an
# optional-dependencies extra it was invisible to ``--dev``, so CI ran
# ``black --check`` with no black on PATH and failed to spawn it.
dev = ["pytest", "pytest-asyncio", "black", "isort", "pre-commit"]

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
"condor.reports" = ["report_runtime.js"]
