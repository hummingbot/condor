[project]
name = "condor"
version = "0.1.0"
description = "Telegram bot for Hummingbot trading via Backend API"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]",
    "hummingbot-api-client==1.5.8",
    "python-dotenv",
    "PyYAML",
    "aiohttp",
    "watchfiles",
    "kaleido",
    "plotly",
    "pandas",
    "geckoterminal-py",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "python-jose[cryptography]",
    "faster-whisper",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "pydantic-ai[mcp]",
    "beautifulsoup4>=4.14.3",
    "markdown>=3.10.2",
    "bleach>=6.4.0",
]

[dependency-groups]
# PEP 735 group: this is what ``uv sync --dev`` installs. Declared as an
# optional-dependencies extra it was invisible to ``--dev``, so CI ran
# ``black --check`` with no black on PATH and failed to spawn it.
dev = ["pytest", "pytest-asyncio", "black", "isort", "pre-commit"]

[tool.uv.sources]
# 1.5.8 is not on PyPI yet (hummingbot/hummingbot-api-client#25). Until that
# releases, resolve the ==1.5.8 pin from the PR branch so ``uv sync`` works in
# CI and locally. Drop this whole block and re-run ``uv lock`` once 1.5.8 ships.
hummingbot-api-client = { git = "https://github.com/hummingbot/hummingbot-api-client.git", branch = "feat/clmm-bin-count" }

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
"condor.reports" = ["report_runtime.js"]
