[project]
name = "condor"
version = "0.1.0"
description = "Telegram bot for Hummingbot trading via Backend API"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]",
    "hummingbot-api-client==1.5.7",
    "python-dotenv",
    "PyYAML",
    "aiohttp",
    "watchfiles",
    "kaleido",
    "plotly",
    "pandas",
    "geckoterminal-py",
    "mcp",
    "fastapi",
    "uvicorn[standard]",
    "python-jose[cryptography]",
    "faster-whisper",
    "matplotlib>=3.10.8",
    "scipy>=1.17.1",
    "pydantic-ai[mcp]",
    "beautifulsoup4>=4.14.3",
    "markdown>=3.10.2",
    "bleach>=6.4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "isort", "pre-commit"]
# The telemetry collector (FEAT-024, telemetry_server/). Kept out of a normal
# install: a bot that only *emits* telemetry has no use for a database driver.
telemetry-server = ["asyncpg"]

[tool.isort]
profile = "black"

[tool.setuptools.package-data]
"condor.reports" = ["report_runtime.js"]
